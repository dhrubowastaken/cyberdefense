[project]
name = "cyberdefense"
version = "0.1.0"
description = "Agentic SOAR-Lite with LLM-Powered Threat Investigation and Human-in-the-Loop Response"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "websockets>=12.0",
    "pandas>=2.1.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
cyberdefense = "cyberdefense.__main__:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
